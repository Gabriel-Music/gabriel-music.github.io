<!DOCTYPE html>

<!--
  Themes:
  data-theme="storm" = dark charcoal palette
  data-theme="warm"  = original-inspired warm palette
-->
<html lang="en" data-theme="storm">
  <head>
    <meta charset="UTF-8">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    >

    <meta
      name="theme-color"
      content="#1a1d23"
    >

    <title>Gabriel Music</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    >

    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    >

    <style>
      :root {
        --background-image: url("local/pexels-ornitorenko-163344579-10959227.jpg");

        --font-body: "Fira Sans", sans-serif;

        --page-padding: 16px;
        --content-width: 1440px;

        --text-small: 12px;
        --text-heading: 18px;
        --text-title: clamp(56px, 10vw, 80px);

        --space-small: 12px;
        --space-medium: 16px;
        --space-large: 24px;
        --space-header: 64px;
      }

      :root,
      html[data-theme="storm"] {
        color-scheme: dark;

        --page-background: #1a1d23;
        --text-color: #eeeeff;
        --muted-color: #ccccdd;
        --link-color: #eef6ff;
        --link-hover: #ccccdd;

        --border-color: #667777;

        --panel-background: rgba(22, 27, 32, 0.50);
        --header-background: rgba(22, 27, 32, 0.75);

        --background-overlay: rgba(12, 18, 24, 0.35);

        --focus-color: #ffffff;
      }

      html[data-theme="warm"] {
        color-scheme: light;

        --page-background: #ffeedd;
        --text-color: #221111;
        --muted-color: #4a4039;
        --link-color: #221111;
        --link-hover: #665544;

        --border-color: #bbaa99;

        --panel-background: rgba(247, 229, 213, 0.90);
        --header-background: rgba(247, 229, 213, 0.90);

        --background-overlay: rgba(247, 229, 213, 0.25);

        --focus-color: #322222;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background-color: var(--page-background);
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;

        display: flex;
        flex-direction: column;

        font-family: var(--font-body);
        font-size: var(--text-small);
        font-weight: 700;
        line-height: 1.5;

        color: var(--text-color);
        background-color: var(--page-background);

        background-image:
          linear-gradient(
            var(--background-overlay),
            var(--background-overlay)
          ),
          var(--background-image);

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
      }

      a {
        color: var(--link-color);
        text-decoration: none;
        transition: color 180ms ease;
      }

      a:hover {
        color: var(--link-hover);
      }

      a:focus-visible {
        outline: 2px solid var(--focus-color);
        outline-offset: 5px;
      }

      .background-image-credit {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }

      .skip-link {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 10;

        padding: var(--space-small);
        background: var(--panel-background);

        transform: translateY(-200%);
      }

      .skip-link:focus {
        transform: translateY(0);
      }

      main,
      footer {
        width: 100%;
        max-width: var(--content-width);
        margin-inline: auto;
        padding-inline: var(--page-padding);
      }

      main {
        flex: 1 0 auto;
      }

      .title-bar {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: var(--space-medium);

        padding-top: var(--space-small);
        padding-bottom: var(--space-header);
      }

      .title-bar__header {
        order: 2;
        align-self: flex-start;

        margin: 0;
        padding: 0 var(--space-medium);

        font-size: var(--text-title);
        line-height: 1.15;
        letter-spacing: 0.02em;

        background: var(--header-background);
      }

      .title-bar__player-container {
        order: 1;
        width: 100%;
      }

      .title-bar__player-container iframe {
        display: block;

        width: 100%;
        height: 80px;

        border: 0;
        border-radius: 10px;

        background: var(--panel-background);
      }

      .portrait-space {
        height: clamp(280px, 48vw, 680px);
        margin-bottom: 20px;

        pointer-events: none;
      }

      .information-tiles {
        display: flex;
        flex-direction: column;

        text-align: center;
        background: var(--panel-background);
      }

      .information-tile {
        flex: 1 1 0;
        min-width: 0;

        display: flex;
        flex-direction: column;

        padding: 20px var(--space-small);
      }

      .information-tile + .information-tile {
        border-top: 4px solid var(--border-color);
      }

      .information-tile h2 {
        margin: 0 0 var(--space-medium);

        font-size: var(--text-heading);
        line-height: 1.25;
        text-transform: uppercase;
      }

      .information-tile p {
        margin: 0 0 var(--space-large);
      }

      .information-tile .region {
        color: var(--muted-color);
        text-transform: uppercase;
      }

      .information-tile a {
        display: inline-block;
        padding-block: 8px;

        overflow-wrap: anywhere;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .divider {
        margin: 0;
        border: 0;
        border-top: 4px solid var(--border-color);
      }

      footer {
        flex-shrink: 0;
        margin-top: auto;
        padding-top: var(--space-medium);
        padding-bottom: var(--space-medium);
      }

      .footer-panel {
        padding: var(--space-small) 0;
        background: var(--panel-background);
      }

      .media-links {
        display: flex;
        flex-direction: column;
        justify-content: space-between;

        list-style: none;
        margin: 0;
        padding: 0;

        text-align: center;
        text-transform: uppercase;
      }

      .media-links a {
        display: flex;
        justify-content: center;
        align-items: center;

        min-height: 44px;
        padding: 8px var(--space-medium);
      }

      @media (min-width: 768px) {
        .title-bar {
          flex-direction: row;
          align-items: center;

          padding-top: var(--space-header);
        }

        .title-bar__header {
          order: 1;
          align-self: auto;
        }

        .title-bar__player-container {
          order: 2;
          width: 300px;
          flex-shrink: 0;
        }

        .information-tiles {
          flex-direction: row;
        }

        .information-tile + .information-tile {
          border-top: 0;
          border-left: 4px solid var(--border-color);
        }

        .divider {
          display: none;
        }

        .media-links {
          flex-direction: row;
          flex-wrap: wrap;
        }

        .media-links li {
          flex: 1 1 auto;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        a {
          transition: none;
        }
      }

      :root {
        --glass-blur: 18px;
        --glass-radius: 16px;
        --glass-tint: rgba(100, 120, 175, 0.25);
        --glass-border: rgba(255, 255, 255, 0.24);
        --glass-highlight: rgba(255, 255, 255, 0.12);
        --glass-shadow: rgba(0, 0, 0, 0.24);
      }

      html[data-theme="warm"] {
        --glass-tint: rgba(247, 229, 213, 0.65);
        --glass-border: rgba(255, 255, 255, 0.65);
        --glass-highlight: rgba(255, 255, 255, 0.36);
        --glass-shadow: rgba(65, 43, 28, 0.16);
      }

      nav.footer-panel,
      .information-tile,
      h1.title-bar__header {
        background: var(--panel-background);
        border: 1px solid var(--glass-border);
        border-radius: var(--glass-radius);
        box-shadow:
          0 4px 12px var(--glass-shadow),
          inset 0 1px 0 var(--glass-highlight);
      }

      .information-tiles {
        background: transparent;
        gap: var(--space-medium);
      }

      .information-tile + .information-tile {
        border: 1px solid var(--glass-border);
      }

      h1.title-bar__header {
        padding-block: 6px;
      }

      .divider {
        display: none;
      }


      @media (prefers-reduced-transparency: reduce) {
        nav.footer-panel,
        .information-tile,
        h1.title-bar__header {
          background: var(--page-background);
          -webkit-backdrop-filter: none;
          backdrop-filter: none;
        }
      }

      .portrait-space {
        position: relative;
        overflow: hidden;
        isolation: isolate;
      }
      .floating-portrait {
        position: absolute;
        left: var(--left);
        top: var(--top);
        width: var(--width);
        aspect-ratio: 4 / 5;
        max-height: 58%;
        padding: 4px;
        border: 1px solid var(--glass-border);
        border-radius: 8px;
        background: linear-gradient(135deg, var(--glass-highlight), transparent 65%), var(--glass-tint);
        box-shadow: 0 4px 10px var(--glass-shadow);
        contain: layout style;
        transform-origin: center;
        animation: portrait-drift var(--duration) ease-in-out var(--delay) infinite alternate;
      }
      .floating-portrait__window {
        position: absolute;
        inset: 4px;
        border-radius: 4px;
        overflow: hidden;
      }
      .floating-portrait img {
        display: block;
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        object-fit: cover;
        object-position: center;
        border-radius: inherit;
        opacity: 1;
      }
      @keyframes portrait-drift {
        from { transform: translate(0, 0) scale(1); }
        to { transform: translate(var(--x), var(--y)) scale(var(--zoom)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .floating-portrait { animation: none; }
      }
      @media (prefers-reduced-transparency: reduce) {
        .floating-portrait {
          background: var(--page-background);
          -webkit-backdrop-filter: none;
          backdrop-filter: none;
        }
      }
      .floating-portrait:nth-child(1) { --left: 3%; --top: 8%; --width: 18%; --duration: 34s; --delay: -10s; --x: 12%; --y: 8%; --zoom: 1.12; }
      .floating-portrait:nth-child(2) { --left: 29%; --top: 4%; --width: 20%; --duration: 42s; --delay: -23s; --x: -12%; --y: 12%; --zoom: 1.16; }
      .floating-portrait:nth-child(3) { --left: 73%; --top: 10%; --width: 18%; --duration: 38s; --delay: -14s; --x: -16%; --y: 10%; --zoom: 1.14; }
      .floating-portrait:nth-child(4) { --left: 13%; --top: 34%; --width: 23%; --duration: 48s; --delay: -30s; --x: 15%; --y: -10%; --zoom: 1.18; }
      .floating-portrait:nth-child(5) { --left: 51%; --top: 30%; --width: 22%; --duration: 44s; --delay: -17s; --x: 16%; --y: -12%; --zoom: 1.16; }

      .floating-portrait img.inversion-layer {
        position: absolute;
        inset: 0;
        filter: invert(1);
        opacity: 0;
      }
      .inversion-layer.is-active {
        animation: inversion-fade 3000ms linear both;
      }
      @keyframes inversion-fade {
        0%, 100% { opacity: 0; }
        16.666667%, 83.333333% { opacity: 1; }
      }
      html.effects-paused .floating-portrait {
        animation-play-state: paused;
      }
      @media (prefers-reduced-motion: reduce) {
        .inversion-layer.is-active { animation: none; }
      }
    </style>
  </head>

  <body>

    <script>
      (() => {
        const root = document.documentElement;
        const region = document.querySelector('.portrait-space');
        if (!region) return;
        const motion = matchMedia('(prefers-reduced-motion: reduce)');
        const active = new Set();
        const layers = Array.from(region.querySelectorAll('img'), image => {
          const layer = image.cloneNode(false);
          layer.className = 'inversion-layer';
          layer.setAttribute('aria-hidden', 'true');
          layer.addEventListener('animationend', () => {
            layer.classList.remove('is-active');
            active.delete(layer);
          });
          image.after(layer);
          return layer;
        });
        let timer;
        let previous;
        let visible = false;
        function schedule() {
          timer = setTimeout(() => {
            let candidates = layers.filter(layer => !active.has(layer) && layer !== previous);
            if (!candidates.length) candidates = layers.filter(layer => !active.has(layer));
            if (candidates.length) {
              const layer = candidates[Math.floor(Math.random() * candidates.length)];
              active.add(layer);
              layer.classList.add('is-active');
              previous = layer;
            }
            schedule();
          }, 1000 + Math.random() * 1000);
        }
        function sync() {
          clearTimeout(timer);
          active.forEach(layer => layer.classList.remove('is-active'));
          active.clear();
          const running = visible && !document.hidden && !motion.matches;
          root.classList.toggle('effects-paused', !running);
          if (running && layers.length) schedule();
        }
        const observer = new IntersectionObserver(entries => {
          visible = entries[0].isIntersecting;
          sync();
        });
        observer.observe(region);
        document.addEventListener('visibilitychange', sync);
        motion.addEventListener('change', sync);
        sync();
      })();
    </script>

</html>
